name: Contractor Foreman
kind: company
description: Contractor Foreman is all-in-one construction management software for
  contractors - estimates, invoicing, scheduling, time cards, daily logs, change
  orders, and job costing - used by contractors in more than 75 countries. There
  is no self-serve public developer API or public API reference; the company's
  dedicated API subdomain (api.contractorforeman.net) displays only a "Coming
  soon" placeholder as of this review. The one confirmed API capability is a
  private, account-scoped API key (generated under Settings > Integration >
  Zapier) that powers Contractor Foreman's official Zapier app, exposing Customer
  and Lead create/archive/delete triggers and actions plus a File Uploaded
  trigger. That key and its underlying endpoints are not documented or published
  for direct third-party use outside the Zapier integration; broader third-party
  connectivity otherwise runs through native integrations (QuickBooks, Gusto,
  Google Calendar/Outlook, Stripe, Angi Leads, CompanyCam, MS Project, SweetPay)
  and Zapier/webhook automation rather than an open API.
