  description: A private, account-scoped REST API reached with an API key generated
    under Settings > Integration > Zapier, used to power Contractor Foreman's
    official Zapier app rather than published for general developer use.
    Capabilities confirmed through Zapier's published trigger/action catalog
    include creating, archiving, and deleting Customer records; creating,
    archiving, and deleting Lead records; and a File Uploaded trigger for
    documents attached to a project. No base URL, endpoint paths, or
    request/response schemas are publicly documented by Contractor Foreman
    itself, so this API is modeled from Zapier's integration catalog only.
