meters:
- name: subscription_tier
  description: Flat monthly/quarterly/annual subscription fee for the selected plan tier (Basic, Standard, Plus, Pro, Unlimited).
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - plan_tier
  - billing_frequency
- name: included_users
  description: Number of user accounts included in the selected plan tier, from 1 (Basic) to unlimited (Unlimited).
  unit: users
  aggregation: max
  dimensions:
  - account
  - plan_tier
- name: zapier_task_usage
  description: Automation tasks consumed when triggers/actions run through the Contractor Foreman Zapier app; metered and billed by Zapier, not by Contractor Foreman.
  unit: tasks
  aggregation: sum
  dimensions:
  - account
  - zap
principles:
- name: Visibility
  description: Track which plan tier and billing frequency (monthly/quarterly/annual) each company account is on, since cost is driven by tier choice rather than usage.
- name: Allocation
  description: Map the Contractor Foreman subscription to the office/back-office cost center, since seats are shared across a company account rather than billed per project.
- name: Optimization
  description: Right-size the tier to actual user-account needs, prefer annual billing for the discount and 100-day money-back guarantee, and use the 30-day free trial before committing.
- name: Accountability
  description: Assign subscription ownership to office administration; review the plan tier annually against active user counts and Zapier automation usage.
