description: >-
  FinOps view of Contractor Foreman spend. Contractor Foreman is bought as a
  flat, per-company subscription (Basic, Standard, Plus, Pro, Unlimited),
  billed monthly, quarterly, or annually and scaled mainly by the number of
  included user accounts rather than by API or transaction volume. There is no
  usage-based or per-API-call billing surface, since Contractor Foreman does
  not publish a public API - the only API-adjacent cost driver is indirect,
  through the Zapier integration, where task/automation consumption counts
  against the customer's own Zapier plan rather than a Contractor Foreman
  meter.
notes: >-
  Costs below reflect the public subscription rate card at
  contractorforeman.com/pricing as of the review date. There is no FOCUS-style
  usage meter to reconcile because Contractor Foreman's billing is a flat
  software subscription, not consumption-based API billing.
