- Plans
description: >-
  Contractor Foreman is sold as a per-company (not strictly per-seat) monthly,
  quarterly, or annual subscription, with five tiers - Basic, Standard, Plus,
  Pro, and Unlimited - distinguished primarily by the number of included user
  accounts and the depth of features (estimating, invoicing, scheduling, time
  cards, job costing, and so on). There is no usage-based or per-API-call
  pricing; these are flat software subscription fees. Every tier includes a
  30-day free trial, and annual plans carry a 100-day money-back guarantee.
notes: >-
  Pricing reflects the public rate card at contractorforeman.com/pricing as of
  the review date and is subject to change; Contractor Foreman periodically
  runs promotional discounts off these list prices. The Basic tier is not
  offered on quarterly billing.
sources:
- https://contractorforeman.com/pricing/
- https://contractorforeman.com/
